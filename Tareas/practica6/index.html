<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Contacto QR - Práctica 6</title>
    <!-- Reutilizando estilos base y agregando locales -->
    <link rel="stylesheet" href="../../assets/css/style.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>
    <div class="container">
        <header class="h.banner">
            <h1>Generador de Contacto QR</h1>
            <p>Ingresa los datos para generar un código QR y agregarlo a tus contactos</p>
            <a href="../../index.html" class="btn btn-back">← Volver al Inicio</a>
        </header>

        <main class="main-content">
            <div class="form-container">
                <form id="contactForm">
                    <div class="form-group">
                        <label for="firstName">Nombre *</label>
                        <input type="text" id="firstName" required placeholder="Ej: Juan">
                    </div>
                    <div class="form-group">
                        <label for="lastName">Apellidos</label>
                        <input type="text" id="lastName" placeholder="Ej: Pérez">
                    </div>
                    <div class="form-group">
                        <label for="phone">Teléfono *</label>
                        <input type="tel" id="phone" required placeholder="Ej: +1 809 555 1234">
                    </div>
                    <div class="form-group">
                        <label for="email">Correo Electrónico</label>
                        <input type="email" id="email" placeholder="Ej: juan@ejemplo.com">
                    </div>
                    <div class="form-group">
                        <label for="company">Organización / Empresa</label>
                        <input type="text" id="company" placeholder="Ej: UASD">
                    </div>
                    <div class="form-group">
                        <label for="title">Cargo</label>
                        <input type="text" id="title" placeholder="Ej: Estudiante">
                    </div>

                    <button type="submit" class="btn btn-primary">Generar Código QR</button>
                    <button type="reset" class="btn btn-secondary">Limpiar Formulario</button>
                </form>
            </div>

            <div class="qr-container">
                <h2>Tu Código QR</h2>
                <p>Escanea este código con tu celular para guardar el contacto.</p>
                <div id="qrcode"></div>
            </div>
        </main>
    </div>

    <!-- Librería QRCode.js -->
    <!-- NOTA: Debido a restricciones técnicas, usamos el CDN. Si deseas hacerlo 100% local, descarga este enlace como qrcode.min.js -->
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <!-- Lógica de nuestra aplicación -->
    <script src="assets/js/script.js"></script>
</body>

</html>
